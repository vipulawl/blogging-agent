name: Blog Pipeline

on:
  schedule:
    - cron: '0 9 * * 1-5'    # Mon–Fri 9am UTC — edit to your timezone
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        type: choice
        options: [pipeline, research, write, refresh]
        default: pipeline

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      PROVIDER:           openai
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL:       ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      STRATEGY_PROVIDER:  openai
      RESEARCH_PROVIDER:  openai
      RESEARCH_MODEL:     ${{ vars.RESEARCH_MODEL || 'gpt-4o-mini' }}
      PRODUCT_URL:        ${{ vars.PRODUCT_URL }}
      BLOG_NICHE:         ${{ secrets.BLOG_NICHE }}
      TARGET_AUDIENCE:    ${{ secrets.TARGET_AUDIENCE }}
      BLOG_TONE:          ${{ secrets.BLOG_TONE }}
      BLOG_LANGUAGE:      ${{ secrets.BLOG_LANGUAGE || 'English' }}
      APPROVAL_MODE:      pr
      CONTENT_DIR:        ${{ vars.CONTENT_DIR }}
      REPO_DIR:           ${{ github.workspace }}
      GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
      GSC_SITE_URL:       ${{ secrets.GSC_SITE_URL }}
      GA4_PROPERTY_ID:    ${{ secrets.GA4_PROPERTY_ID }}
      GOOGLE_CREDENTIALS_FILE: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' && 'google-credentials.json' || '' }}
      MAX_ARTICLES_PER_DAY:       ${{ vars.MAX_ARTICLES_PER_DAY || '1' }}
      MIN_QUEUE_SIZE:             ${{ vars.MIN_QUEUE_SIZE || '3' }}
      MIN_TOPICS_PER_RESEARCH:    ${{ vars.MIN_TOPICS_PER_RESEARCH || '3' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "Blogging Agent"
          git config user.email "bot@noreply.github.com"

      - name: Write Google credentials (if configured)
        if: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' }}
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      # ── Pipeline: checkpointed steps so dashboard sees mid-run state ──

      - name: Research
        if: ${{ !github.event.inputs.action || github.event.inputs.action == 'pipeline' || github.event.inputs.action == 'research' }}
        run: python main.py research

      - name: 📡 DB checkpoint
        if: ${{ always() && (!github.event.inputs.action || github.event.inputs.action == 'pipeline' || github.event.inputs.action == 'research') }}
        run: |
          git add -f blogging_agent.db 2>/dev/null || true
          git diff --staged --quiet \
            || git commit -m "chore: db checkpoint after research [skip ci]" && git push || true

      - name: Write
        if: ${{ !github.event.inputs.action || github.event.inputs.action == 'pipeline' || github.event.inputs.action == 'write' }}
        run: python main.py write

      - name: 📡 DB checkpoint
        if: ${{ always() && (!github.event.inputs.action || github.event.inputs.action == 'pipeline' || github.event.inputs.action == 'write') }}
        run: |
          git add -f blogging_agent.db 2>/dev/null || true
          git diff --staged --quiet \
            || git commit -m "chore: db checkpoint after write [skip ci]" && git push || true

      - name: Refresh
        if: ${{ github.event.inputs.action == 'refresh' }}
        run: python main.py refresh

      - name: Persist state
        if: always()
        run: |
          git add -f blogging_agent.db 2>/dev/null || true
          git diff --staged --quiet \
            || git commit -m "chore: blog agent state [skip ci]" && git push || true
